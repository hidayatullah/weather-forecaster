<style>
.wrap{position:relative;overflow:hidden;padding:4px 0 0}
.wx{display:grid;grid-template-columns:repeat({{COLUMNS_PER_ROW}},minmax(0,1fr));gap:8px}
.col{background:var(--surface-1);border-radius:var(--radius);padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.col.now{background:var(--surface-2);border:2px solid var(--border-stronger)}
.col.off{box-shadow:inset 0 0 0 1px var(--border-stronger)}
.t{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:3px}
.tag{font-size:11px;color:var(--text-muted)}
.ic{font-size:30px}
.temp{font-size:22px;font-weight:500}
.wind{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.gust{font-size:11px;color:var(--text-muted)}
.al{color:var(--text-danger)}
.ribbon{position:absolute;top:22px;right:-52px;transform:rotate(35deg);background:#A32D2D;color:#fff;font-size:12px;font-weight:500;letter-spacing:.02em;padding:5px 60px;z-index:2;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface-1);border:0.5px solid var(--border-strong);color:var(--text-secondary);font-size:12px;padding:2px 10px;border-radius:var(--radius)}
@media (max-width:620px){.wx{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.wx{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<h2 class="sr-only">{{SR_SUMMARY}}</h2>
<div class="wrap">
{{SAMPLE_RIBBON}}
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;gap:8px;flex-wrap:wrap{{HEADER_PADDING}}">
<span style="font-size:16px;font-weight:500">{{LOCATION}}</span>
<span class="badge"><i class="ti ti-calendar-star" style="font-size:15px" aria-hidden="true"></i>{{BADGE_TEXT}}</span>
</div>
{{BANNER}}
<div class="wx">
{{PERIOD_COLUMNS}}
</div>
<p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">{{CAPTION}}</p>
</div>
