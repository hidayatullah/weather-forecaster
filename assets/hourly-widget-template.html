<style>
.wx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.col{background:var(--surface-1);border-radius:var(--radius);padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.col.now{background:var(--surface-2);border:2px solid var(--border-stronger)}
.t{font-size:13px;color:var(--text-secondary)}
.tag{font-size:11px;color:var(--text-muted)}
.ic{font-size:30px;color:var(--text-primary)}
.temp{font-size:22px;font-weight:500}
.wind{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:4px}
.gust{font-size:11px;color:var(--text-muted)}
.al{color:var(--text-danger)}
@media (max-width:520px){.wx{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<h2 class="sr-only">{{SR_SUMMARY}}</h2>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px">
<span style="font-size:16px;font-weight:500">{{LOCATION}}</span>
<span style="font-size:13px;color:var(--text-secondary)">{{DATE}} · High {{HIGH}}°F</span>
</div>
{{BANNER}}
<div class="wx">
{{COLUMN_1}}
{{COLUMN_2}}
{{COLUMN_3}}
{{COLUMN_4}}
{{COLUMN_5}}
{{COLUMN_6}}
</div>
<p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">{{CAPTION}} <a href="{{SOURCE_URL}}">View on weather.gov</a></p>
